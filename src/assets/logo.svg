<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Dark mode app-icon background -->
    <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#1E1E24"/>

    <defs>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <g filter="url(#softShadow)">
        <!-- Kanban cards -->
        <rect x="130" y="130" width="70" height="120" rx="18" ry="18" fill="#FF7096"/>
        <rect x="215" y="100" width="70" height="200" rx="18" ry="18" fill="#4EA8DE"/>
        <rect x="300" y="150" width="70" height="140" rx="18" ry="18" fill="#64A567"/>

        <!-- Pomodoro timer -->
        <circle cx="256" cy="300" r="110" fill="#FF477E"/>
        <circle cx="256" cy="300" r="95" fill="#93003A"/>
        <circle cx="256" cy="300" r="28" fill="#FF477E"/>

        <!-- Progress arc -->
        <path d="M256 190 A110 110 0 0 1 366 300"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="14"
              stroke-linecap="square"
              stroke-dasharray="25"
              opacity="0.85"/>
    </g>
</svg>
